<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login to Your Account</mat-card-title>
      <mat-card-subtitle>Welcome back to Capital Hardware</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="off" placeholder="Enter your email" />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error appFieldError></mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput autocomplete="off" [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            placeholder="Enter your password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error appFieldError></mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading"
          class="full-width login-button">
          @if (isLoading) {
          <mat-spinner diameter="20"></mat-spinner>
          Logging in...
          } @else {
          Login
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <p class="register-link">
        Don't have an account?
        <a routerLink="/register">Contact us</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
